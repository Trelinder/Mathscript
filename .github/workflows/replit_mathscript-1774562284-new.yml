# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions
# More info on Python, GitHub Actions, and Azure App Service: https://aka.ms/python-webapps-actions

name: Build and deploy Python app to Azure Web App - mathscript-1774562284-new

on:
  push:
    branches:
      - replit
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Build React frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Set up Python version
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install dependencies into deployment package
        run: |
          python -m pip install --target=.python_packages/lib/site-packages -r requirements.txt
                
      - name: Upload artifact for deployment jobs
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          include-hidden-files: true
          path: |
            .deployment
            .python_packages/
            backend/
            frontend/dist/
            frontend/public/images/
            requirements.txt
            runtime.txt
            startup.sh

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_DBA58E63865E41D0BC2B6FA3D970837F }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_FECB0AD5C8F7457888ACE41B9375A19D }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_F5473ECEF7844370941B9EF246C79FFB }}

      - name: Disable remote Oryx build
        run: az webapp config appsettings set --resource-group mathscript-web-rg --name mathscript-1774562284-new --settings SCM_DO_BUILD_DURING_DEPLOYMENT=false --output none

      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: 'mathscript-1774562284-new'
          slot-name: 'Production'
          