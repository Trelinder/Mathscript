# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions
# More info on Python, GitHub Actions, and Azure App Service: https://aka.ms/python-webapps-actions

name: Build and deploy Python app to Azure Web App - mathscript-1774562284-new

on:
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read # This is required for actions/checkout
      id-token: write # Required for Azure OIDC login

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Build React frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Set up Python version
        uses: actions/setup-python@v5
        with:
          # Match the Azure App Service runtime (Python 3.14) so compiled packages
          # installed in CI use the same ABI as production.
          python-version: "3.14"

      # 🛠️ Local Build Section (Optional)
      # The following section in your workflow is designed to catch build issues early on the client side, before deployment. This can be helpful for debugging and validation. However, if this step is not required, you can remove it.
      - name: Create and Start virtual environment and Install dependencies
        run: |
          python -m venv antenv
          source antenv/bin/activate
          pip install -r requirements.txt
          python scripts/smoke_backend.py

      # By default, when you enable GitHub CI/CD integration through the Azure portal, the platform automatically sets the SCM_DO_BUILD_DURING_DEPLOYMENT application setting to true. This triggers the Oryx build process.
      - name: Create deployment package
        run: |
          zip -r python-app.zip . \
            -x 'antenv/*' \
            -x 'frontend/node_modules/*' \
            -x '.git/*' \
            -x '*.zip'

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_DBA58E63865E41D0BC2B6FA3D970837F }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_FECB0AD5C8F7457888ACE41B9375A19D }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_F5473ECEF7844370941B9EF246C79FFB }}

      # 🚫 Opting Out of Oryx Build
      # If you prefer to disable the Oryx build process during deployment, follow these steps:
      # 1. Remove the SCM_DO_BUILD_DURING_DEPLOYMENT app setting from your Azure App Service Environment variables.
      # 2. Refer to sample workflows for alternative deployment strategies: https://github.com/Azure/actions-workflow-samples/tree/master/AppService

      - name: "Deploy to Azure Web App"
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: "mathscript-1774562284-new"
          slot-name: "Production"
          package: python-app.zip
          # Set the startup command once in Azure Portal:
          # App Service → Configuration → Stack settings → Startup Command
          # python -m uvicorn backend.main:app --host 0.0.0.0 --port 8000 --timeout-keep-alive 75
