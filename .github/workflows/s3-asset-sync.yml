name: Sync Assets to S3

on:
  push:
    branches:
      - replit
    paths:
      - 'frontend/public/assets/**'

jobs:
  sync-to-s3:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Sync Assets to S3
        run: |
          aws s3 sync frontend/public/assets s3://math-script-assets-2026/ --delete
          
      - name: Remove Assets to Prevent Deployment Bloat
        run: |
          rm -rf frontend/public/assets/*
          echo "Assets synced to S3 and cleaned from the GitHub runner environment."
