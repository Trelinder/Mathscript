<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Mathscript Underground Data Center</title>
  <style>
    * { box-sizing: border-box; }
    :root { --surface: #eef3f4; --ink: #263238; --activity: #147d7a; --reward: #d1a644; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: var(--ink); }
    #unity-canvas { display: block; width: 100%; height: 100%; outline-offset: -3px; touch-action: none; }
    #unity-canvas:focus-visible { outline: 3px solid var(--activity); }
    #loading { position: fixed; inset: 0; display: grid; place-content: center; gap: 16px; padding: 24px; color: var(--ink); font: 600 20px "Trebuchet MS", sans-serif; text-align: center; background: var(--surface); }
    #loading span { font-size: 16px; font-weight: 400; }
    progress { width: min(280px, 75vw); accent-color: var(--activity); }
    #error { position: fixed; inset: 0; display: none; place-content: center; padding: 24px; color: var(--ink); background: var(--surface); font: 16px "Trebuchet MS", sans-serif; }
    button { min-height: 44px; padding: 8px 16px; color: var(--ink); background: var(--reward); border: 0; border-radius: 4px; cursor: pointer; }
  </style>
</head>
<body>
  <canvas id="unity-canvas" tabindex="0" aria-label="Mathscript underground data-center game"></canvas>
  <div id="loading" role="status"><strong>MATHSCRIPT</strong><span>Underground Data Center</span><progress max="1" value="0" aria-label="Loading game"></progress></div>
  <div id="error" role="alert"><p id="error-message"></p><button type="button" onclick="location.reload()">Retry</button></div>
  <script src="Build/mathscript-portal-candidate-20261107.loader.js"></script>
  <script>
    const canvas = document.getElementById('unity-canvas');
    canvas.width = canvas.clientWidth;
    canvas.height = canvas.clientHeight;
    const config = {
      dataUrl: 'Build/mathscript-portal-candidate-20261107.data',
      frameworkUrl: 'Build/mathscript-portal-candidate-20261107.framework.js',
      codeUrl: 'Build/mathscript-portal-candidate-20261107.wasm',
      streamingAssetsUrl: 'StreamingAssets',
      companyName: 'MathscriptPrototype',
      productName: 'Mathscript Idle Tower',
      productVersion: '1.0',
      autoSyncPersistentDataPath: true,
      matchWebGLToCanvasSize: true,
      devicePixelRatio: Math.min(window.devicePixelRatio || 1, 1.5),
      showBanner(message, type) {
        if (type === 'error') showError(message);
        else console.warn(message);
      }
    };
    function showError(message) {
      document.getElementById('loading').style.display = 'none';
      document.getElementById('error-message').textContent = String(message);
      document.getElementById('error').style.display = 'grid';
    }
    createUnityInstance(canvas, config, value => {
      document.querySelector('progress').value = value;
    }).then(instance => {
      window.unityInstance = instance;
      document.getElementById('loading').style.display = 'none';
      canvas.focus();
    }).catch(showError);
  </script>
</body>
</html>
